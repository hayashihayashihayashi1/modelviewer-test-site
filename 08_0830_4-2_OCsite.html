<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【4-②】屋外誘導</title>

<link rel="stylesheet" href="css/style.css">

<script type="module"
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">



</script>


<script>
document.addEventListener('DOMContentLoaded', () => {

  const hotspots = document.querySelectorAll('.Hotspot');

  hotspots.forEach(hotspot => {
    hotspot.addEventListener('click', () => {

      const id = hotspot.id;

      const targetItem = document.querySelector(
        `.job-item[data-target="${id}"]`
      );

      if (targetItem) {
        targetItem.click();
      }

    });
  });

});

window.addEventListener('load', () => {
  resetAll();
});
</script>

</head>



<body>


  <div class="top-logo">
  <a href="index.html">
  <img src="images/0-0_logos/20260315_mezisuta_logo.svg" alt="logo">
  </a>
</div>

  
<div class="top-buttons">
  <button onclick="location.href='index.html'">← 戻る</button>
  <button id="infoBtn">i info</button>
</div>

<h1>【4-②】屋外誘導</h1>


<div class="viewer-container">




<model-viewer 
  id="viewer"
  src="models/20260222_WEB_MejiroUni_MatMap.glb"
  camera-controls
  tone-mapping="neutral"
  shadow-intensity="0"
  camera-orbit="40deg 50deg 500m"
  min-camera-orbit="auto 0deg 250m"
  max-camera-orbit="auto 90deg 600m">
  

    <button class="Hotspot" slot="hotspot-1" id="hs1"

        <div class="HotspotAnnotation">①1号館前受付通過直後</div>
        <img src="images/4-2images/4-2_1_20260719_1goukantuuka.jpg" class="popup-image">
    </button>

    <button class="Hotspot" slot="hotspot-3" id="hs2"
      data-surface="1 0 1143 171 162 0.012 0.207 0.781">
        <div class="HotspotAnnotation">②1号館前受付通過直後～2号館</div>
        <img src="images/3-3images/3-3_3_2goukanmae.jpg" class="popup-image">
    </button>

     <button class="Hotspot" slot="hotspot-4" id="hs3"
      data-surface="1 0 95 125 1105 0.540 0.370 0.089">
        <div class="HotspotAnnotation">④7号館～10号館</div>
        <img src="" class="popup-image">
    </button>
    
    <button class="Hotspot" slot="hotspot-5" id="hs4"
      data-surface="1 0 64 195 189 0.628 0.165 0.206">
        <div class="HotspotAnnotation">③時計塔の下</div>
        <img src="images/3-3images/3-3_4_tokeitousita.jpg" class="popup-image">
    </button>

    <button class="Hotspot" slot="hotspot-6" id="hs5"
      data-surface="1 0 955 898 901 0.248 0.619 0.133">
        <div class="HotspotAnnotation">⑥8号館前</div>
        <img src="images/3-3images/3-3_5_guraundomae.jpg" class="popup-image">
    </button>

    <button class="Hotspot" slot="hotspot-7" id="hs6"
      data-surface="1 0 128 125 95 0.159 0.561 0.280">
        <div class="HotspotAnnotation">⑦10号館入口前誘導</div>
        <img src="images/3-3images/3-3_6_kittinka.jpg" class="popup-image">
    </button>

     <button class="Hotspot" slot="hotspot-8" id="hs7"
      data-surface="1 0 89 95 892 0.328 0.483 0.189">
        <div class="HotspotAnnotation">⑧キッチンカー列誘導</div>
        <img src="images/4-2images/4-2_8_20260719_キッチンカー.jpg" class="popup-image">
    </button>

         <button class="Hotspot" slot="hotspot-9" id="hs8"
      data-surface="1 0 953 901 903 -1.907 1.426 1.482">
        <div class="HotspotAnnotation">⑨起震車呼び込み・列誘導</div>
        <img src="" class="popup-image">
    </button>

      <button class="Hotspot" slot="hotspot-10" id="hs9"
      data-surface="1 0 308 304 334 0.250 0.533 0.216">
        <div class="HotspotAnnotation">⑤記念館スロープ～正面入口前</div>
        <img src="images/4-2images/4-2_5_20260719_kinennkannmae.jpg" class="popup-image">
    </button>


</model-viewer>
</div>

<svg id="lineLayer"></svg>
<div class="bottom-panel">
  <div class="job-item" data-target="hs1">①1号館前受付通過直後</div>
  <div class="job-item" data-target="hs2">②1号館前受付通過直後～2号館</div>
  <div class="job-item" data-target="hs4">③時計塔の下～ストーンサークル</div>
  <div class="job-item" data-target="hs3">④7号館～10号館</div>
  <div class="job-item" data-target="hs9">⑤記念館スロープ～正面入口前</div>
  <div class="job-item" data-target="hs5">⑥8号館前</div>
  <div class="job-item" data-target="hs6">⑦10号館入口前誘導</div>
  <div class="job-item" data-target="hs7">⑧キッチンカー列誘導</div>
  <div class="job-item" data-target="hs8">⑨起震車呼び込み・列誘導</div>
  


</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>このページについて</h2>
    <p>
      スワイプでモデル回転、二本指で拡大縮小<br>
      左クリックしてドラッグでモデル回転、マウスホイールで拡大縮小<br>
      下のボタンでその場所を強調し、その場所の画像を表示します<br>
      2026ハヤシ
    </p>
  </div>
</div>

<script>
const items = document.querySelectorAll('.job-item');
const hotspots = document.querySelectorAll('.Hotspot');
const svg = document.getElementById('lineLayer');
const viewer = document.getElementById('viewer');
const modal = document.getElementById('modal');
const infoBtn = document.getElementById('infoBtn');


infoBtn.addEventListener('click', ()=>{
  modal.style.display = 'flex';
});

modal.addEventListener('click', (e)=>{
  if(e.target === modal){
    modal.style.display = 'none';
  }
});

function resetAll(){
  svg.innerHTML = '';
  items.forEach(i=>i.classList.remove('active'));
  hotspots.forEach(h=>{
    h.classList.remove('dim');
    h.querySelector('.popup-image').style.display='none';
  });
}

async function centerHotspot(target){

  await viewer.updateComplete;

  const hotspot = viewer.queryHotspot(target.slot);
  if(!hotspot) return;

  const pos = hotspot.position;

  viewer.cameraTarget = `${pos.x}m ${pos.y}m ${pos.z}m`;


  let theta, phi, radius;

  switch(target.id){

    case "hs1": 
      theta = "50deg";
      phi   = "70deg";
      radius = "150m";
      break;

    case "hs2": 
      theta = "50deg";
      phi   = "65deg";
      radius = "180m";
      break;

    case "hs3": 
      theta = "24deg";
      phi   = "57deg";
      radius = "220m";
      break;

    case "hs4": 
      theta = "0.9deg";
      phi   = "57deg";
      radius = "260m";
      break;

    case "hs5": 
      theta = "319deg";
      phi   = "56deg";
      radius = "263m";
      break;

        case "hs8": 
      theta = "-70deg";
      phi   = "56deg";
      radius = "263m";
      break;

    default:
      theta = "10deg";
      phi   = "60deg";
      radius = "200m";
  }

  viewer.cameraOrbit = `${theta} ${phi} ${radius}`;
}

function drawLineTo(activeItem) {
  svg.innerHTML = '';
  const id = activeItem.dataset.target;
  const hotspot = document.getElementById(id);
  const rect1 = hotspot.getBoundingClientRect();
  const rect2 = activeItem.getBoundingClientRect();
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", rect1.left + rect1.width/2);
  line.setAttribute("y1", rect1.top + rect1.height/2);
  line.setAttribute("x2", rect2.left + rect2.width/2);
  line.setAttribute("y2", rect2.top);
  line.setAttribute("stroke", "crimson");
  line.setAttribute("stroke-width", "2");
  svg.appendChild(line);
}

items.forEach(item=>{
  item.addEventListener('click', ()=>{
    if(item.classList.contains('active')){
      resetAll();
      return;
    }

    items.forEach(i=>i.classList.remove('active'));
    hotspots.forEach(h=>{
      h.classList.add('dim');
      h.querySelector('.popup-image').style.display='none';
    });

    item.classList.add('active');

    const target = document.getElementById(item.dataset.target);
    target.classList.remove('dim');
    target.querySelector('.popup-image').style.display='block';

    drawLineTo(item);

    
    centerHotspot(target);
  });
});

viewer.addEventListener('camera-change', ()=>{
  const activeItem = document.querySelector('.job-item.active');
  if(activeItem) drawLineTo(activeItem);
});

window.addEventListener('resize', ()=>{
  const activeItem = document.querySelector('.job-item.active');
  if(activeItem) drawLineTo(activeItem);
});
</script>

</body>
</html>
